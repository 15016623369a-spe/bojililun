# 每个 PR 和推到 main 时检查：类型、手账测试、教练测试、雕塑标签测试、生产构建。
# 用 Node 24：服务端依赖 node:sqlite，和本地开发一致。
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 手账测试
        run: npm run test:ledger
      - name: 教练测试
        run: node --test tests/coach.cjs tests/coach-data.cjs
      - name: 雕塑标签测试
        run: node --test scripts/sculpture-labels.test.cjs
      - name: 生产构建
        run: npm run build
